---

name: pip-tools

on:
  workflow_dispatch:
    inputs:
      package-distribuition:
        # github.event_name == 'workflow_dispatch'
        # && github.event.inputs.package-distribuition
        description: >-
          A target Python package distribution to upgrade
        required: false
  pull_request:
    paths:
    - .github/workflows/pip-tools.yml
    - .github/workflows/reusable-pip-tools.yml
  schedule:
  - cron: 1 0 * * *  # Run daily at 0:01 UTC

env:
  git-branch: >-
    maintenance/pip-tools-constraint-lockfiles${{
      (
      github.event_name == 'workflow_dispatch'
      && github.event.inputs.package-distribuition
      )
      && format('-updating-{0}', github.event.inputs.package-distribuition)
      || ''
    }}

concurrency:
  group: >-
    ${{
        github.workflow
    }}-${{
        github.event.inputs.package-distribuition
        || github.event.pull_request.number
        || github.sha
    }}
  cancel-in-progress: true

jobs:

  deps:
    name: ⛓🔒 Lock files${{ '' }}  # nest jobs under the same sidebar category
    strategy:
      matrix:
        python-version:
        # NOTE: The latest and the lowest supported Pythons are prioritized
        # NOTE: to improve the responsiveness. It's nice to see the most
        # NOTE: important results first.
        - 3.14
        - 3.13
        # NOTE: Python 3.8 is not locked anymore, since the last tox
        # NOTE: release supporting it lacks the hook needed for injecting
        # NOTE: the lock file generation env. Its existing lock files are
        # NOTE: kept as is, considering that this runtime has reached EOL.
        - 3.9
        # NOTE: Pinned to 7.3.23 rather than tracking latest: 8.0.0 has a
        # NOTE: CFFI buffer-export bug breaking reads of TLS streams to
        # NOTE: EOF. Ref: https://github.com/pypy/pypy/issues/5589
        # NOTE: Already fixed upstream (pypy/pypy@66c739f5370), but not
        # NOTE: yet in a released version as of 2026-09-26. Re-track
        # NOTE: latest once a release includes the fix.
        - pypy-3.11-v7.3.23
        - 3.12
        - 3.11
        - >-
          3.10
        - 3.15
        runner-vm-os:
        - ubuntu-24.04-arm
        - macOS-26  # arm64
        - ubuntu-22.04
        - macOS-26-intel
        - windows-2022
        lock-file-env:
        # NOTE: The envs with lock files symlinked to the `build-docs` ones,
        # NOTE: like `doctest-docs`, are covered by locking `build-docs`.
        # NOTE: All the envs are locked for all the runtimes and platforms
        # NOTE: so that contributors could use them in any environment, even
        # NOTE: if CI/CD only runs some of them in a subset of those. Mind
        # NOTE: the limit of 256 configurations per job that GitHub has: the
        # NOTE: matrix may need splitting across several calling jobs.
        - build-dists
        - build-docs
        - linkcheck-docs
        - pre-commit
        - py
        - spellcheck-docs
        lock-file-extra-input:
        - pyproject.toml
        - ''
        exclude:
        - lock-file-env: build-dists
          lock-file-extra-input: pyproject.toml
        - lock-file-env: build-docs
          lock-file-extra-input: ''
        - lock-file-env: linkcheck-docs
          lock-file-extra-input: ''
        - lock-file-env: pre-commit
          lock-file-extra-input: pyproject.toml
        - lock-file-env: py
          lock-file-extra-input: ''
        - lock-file-env: spellcheck-docs
          lock-file-extra-input: ''
        # NOTE: `myst-parser` used for building the docs requires Python 3.11+.
        - lock-file-env: build-docs
          python-version: 3.9
        - lock-file-env: build-docs
          python-version: >-
            3.10
        - lock-file-env: linkcheck-docs
          python-version: 3.9
        - lock-file-env: linkcheck-docs
          python-version: >-
            3.10
        - lock-file-env: spellcheck-docs
          python-version: 3.9
        - lock-file-env: spellcheck-docs
          python-version: >-
            3.10

    uses: ./.github/workflows/reusable-pip-tools.yml
    with:
      lock-file-env: ${{ matrix.lock-file-env }}
      lock-file-extra-input: ${{ matrix.lock-file-extra-input }}
      python-version: ${{ matrix.python-version }}
      runner-vm-os: ${{ matrix.runner-vm-os }}
      # NOTE: 2 minutes was too tight for 3.15 @ macOS-15-intel, which
      # NOTE: consistently ran ~2m48s and got cancelled by the timeout,
      # NOTE: blocking the Open/refresh a PR step every time.
      timeout-minutes: 5
      upgrade-package: >-
        ${{
          github.event_name == 'workflow_dispatch'
          && github.event.inputs.package-distribuition
          || ''
        }}

  check:  # This job does nothing and is only used for the branch protection
    name: >-
      check
      ⮸
      ${{
      (
          github.event_name == 'workflow_dispatch'
          && github.event.inputs.package-distribuition
      )
      && format('`{0}`', github.event.inputs.package-distribuition)
      || 'everything'
      }}
    if: always()

    needs:
    - deps

    runs-on: ubuntu-latest

    timeout-minutes: 1

    steps:
    - name: Decide whether the needed jobs succeeded or failed
      uses: re-actors/alls-green@release/v1
      with:
        jobs: ${{ toJSON(needs) }}

  publish-pr:
    name: Open/refresh a PR
    if: github.event_name != 'pull_request'
    needs:
    - check
    runs-on: Ubuntu-latest

    # NOTE: Signing makes `create-pull-request` recreate every commit via
    # NOTE: 3 throttled GitHub API calls, taking ~3s per lock file. With
    # NOTE: all the lock files updated, this adds up to ~13 minutes.
    timeout-minutes: 20

    environment:
      name: pip-tools
      url: ${{ steps.pr.outputs.pull-request-url }}

    permissions:
      contents: write  # Needed to push the PR branch
      pull-requests: write

    steps:
    - name: Download all the dists
      id: artifacts-download
      continue-on-error: true  # and judge whether there's updates later
      uses: actions/download-artifact@v4
      with:
        merge-multiple: true
        path: ${{ runner.temp }}/patches/
        pattern: pip-constraints-git-patches--*
    - name: >-
        Determine whether any change suggestions to lockfiles
        have been produced
      if: steps.artifacts-download.outcome == 'success'
      id: artifacts
      run: >-
        echo "lockfile-updates-needed=true" >> "${GITHUB_OUTPUT}"
    - name: Grab the source from Git
      if: steps.artifacts.outputs.lockfile-updates-needed
      uses: actions/checkout@v3
    - name: Setup git user as [bot]
      if: steps.artifacts.outputs.lockfile-updates-needed
      # Refs:
      # * https://github.community/t/github-actions-bot-email-address/17204/6
      # * https://github.com/actions/checkout/issues/13#issuecomment-724415212
      uses: fregante/setup-git-user@v1.1.0

    - name: List Git patches
      if: steps.artifacts.outputs.lockfile-updates-needed
      run: ls -alh '${{ runner.temp }}/patches/'
    - name: Apply patches to the Git repo
      if: steps.artifacts.outputs.lockfile-updates-needed
      run: git am '${{ runner.temp }}/patches'/*.patch

    - name: Create a PR
      if: steps.artifacts.outputs.lockfile-updates-needed
      id: pr
      uses: peter-evans/create-pull-request@v8.1.1
      with:
        base: ${{ github.event.repository.default_branch }}
        body: >-
          Automated pip-tools-managed pip constraint lockfiles update.
        branch: ${{ env.git-branch }}
        draft: always-true
        sign-commits: true
        title: >-
          Bump transitive deps in pip-tools-managed lockfiles${{
          (
          github.event_name == 'workflow_dispatch'
          && github.event.inputs.package-distribuition
          )
          && format(' for {0}', github.event.inputs.package-distribuition)
          || ''
          }}
        token: ${{ github.token }}
    - name: Log the pull request details
      run: >-
        echo
        "PR number: ${{ steps.pr.outputs.pull-request-number }}"
        "\nPR URL: ${{ steps.pr.outputs.pull-request-url }}"
    - name: Instruct the maintainers to trigger CI by undrafting the PR
      if: steps.pr.outputs.pull-request-operation == 'created'
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: >-
        gh pr comment
        --body 'Please mark the PR as ready for review to trigger PR checks.'
        --repo '${{ github.repository }}'
        '${{ steps.pr.outputs.pull-request-url }}'

    - name: Enable auto-merge for the PR
      if: steps.pr.outputs.pull-request-operation == 'created'
      run: >-
        gh pr merge
        --auto --merge
        '${{ steps.pr.outputs.pull-request-url }}'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

...
