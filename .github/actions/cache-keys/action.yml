---

outputs:
  cache-key-for-dep-files:
    description: >-
      A cache key string derived from the dependency declaration files.
    value: ${{ steps.calc-cache-key-files.outputs.files-hash-key }}

runs:
  using: composite
  steps:
  - name: >-
      Calculate dependency files' combined hash value
      for use in the cache key
    id: calc-cache-key-files
    run: |
      from os import environ
      from pathlib import Path

      FILE_APPEND_MODE = 'a'

      # NOTE: Bump this whenever the cache lineage needs to be
      # NOTE: abandoned deliberately -- e.g. a corrupted/stale entry
      # NOTE: kept getting restored and re-saved indefinitely (as
      # NOTE: happened with the Windows pip-tools.yml pypy-3.11 job's
      # NOTE: IncompleteRead failures, caused by a truncated cached
      # NOTE: copy of the PyPI index page for `pip-tools`). Bumping
      # NOTE: this changes the key, so a fresh cache gets built; the
      # NOTE: old, orphaned entries are cleaned up automatically by
      # NOTE: GitHub's cache eviction policy.
      cache_salt = 'v1'

      files_derived_hash = '${{
          hashFiles(
            'tox.ini',
            'pyproject.toml',
            '.pre-commit-config.yaml',
            'pytest.ini',
            'dependencies/**'
          )
      }}'
      files_derived_hash = f'{cache_salt}-{files_derived_hash}'

      print(f'Computed file-derived hash is {files_derived_hash}.')

      with Path(environ['GITHUB_OUTPUT']).open(
              mode=FILE_APPEND_MODE,
      ) as outputs_file:
          print(
              f'files-hash-key={files_derived_hash}',
              file=outputs_file,
          )
    shell: python

...
